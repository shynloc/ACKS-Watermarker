name: Feature request
description: Suggest a focused product or workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe the user need before proposing the interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Desktop and mobile
        - Desktop
        - Mobile
        - Batch workflow
        - Deployment or documentation
    validations:
      required: true
