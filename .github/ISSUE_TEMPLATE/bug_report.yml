name: Bug report
description: Report a reproducible problem in ACKS Watermarker
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private source images, credentials, or unsanitized screenshots.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v2.0.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 151 on macOS 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a non-sensitive example whenever possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private images, credentials, and personal information from this report.
          required: true
